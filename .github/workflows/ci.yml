name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy worthit
      - name: Unit and live isolation checks
        run: python -m unittest discover -s tests -v
        env:
          WORTHIT_DOCKER_TESTS: "1"
      - name: Build and sanitize publication
        run: |
          worthit build-site --base-path /worthit/ --site-url https://drj0e.github.io/worthit
          worthit verify-site --base-path /worthit/
