name: Daily verification

on:
  schedule:
    - cron: "17 05 * * *"
  workflow_dispatch:

concurrency:
  group: worthit-daily
  cancel-in-progress: false

jobs:
  discover:
    outputs:
      run_date: ${{ steps.clock.outputs.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Fix the UTC operating date for every job
        id: clock
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Discover and qualify without executing candidate code
        run: worthit daily --run-date "${{ steps.clock.outputs.date }}" --base-path /worthit/ --site-url https://drj0e.github.io/worthit
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-state
          path: |
            data/candidates.json
            hunts
          if-no-files-found: error
          retention-days: 2

  evaluate:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore bounded evaluator state
        id: resume-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .worthit/resume-cache
          key: worthit-resume-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            worthit-resume-v1-${{ runner.os }}-
      - name: Rehydrate vetted evaluator state
        if: steps.resume-cache.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          root=.worthit/resume-cache
          test -d "$root/runs"
          test "$(find "$root" -type f | wc -l)" -le 750
          test "$(du -sb "$root" | cut -f1)" -le 52428800
          test -z "$(find "$root" ! -type d ! -type f -print -quit)"
          while IFS= read -r -d '' file; do
            relative=${file#"$root/"}
            [[ "$relative" =~ ^runs/[^/]+/[0-9a-f]{40}/(state\.json|[^/]*-model[^/]*/(response\.json|request\.sha256))$ ]]
            test "$(stat -c %s "$file")" -le 5000000
            case "$relative" in
              */state.json)
                sha=${relative%/state.json}
                sha=${sha##*/}
                jq -e --arg sha "$sha" '.commit_sha == $sha and (.repository_url | type) == "string" and (.inspection_revision | type) == "number" and (.stages | type) == "object"' "$file" >/dev/null
                ;;
              */response.json)
                jq -e 'keys == ["structured_output", "total_cost_usd"] and (.structured_output | type) == "object" and (.total_cost_usd | type) == "number"' "$file" >/dev/null
                ;;
              */request.sha256)
                test "$(wc -l < "$file")" -eq 1
                grep -Eq '^[0-9a-f]{64}$' "$file"
                ;;
              *.json) jq -e . "$file" >/dev/null ;;
            esac
          done < <(find "$root" -type f -print0)
          mkdir -p .worthit/runs
          cp -a -- "$root/runs/." .worthit/runs/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-state
          path: .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Detect evaluator authentication
        id: auth
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY}${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Claude credential is configured; publishing the discovery report without execution."
          fi
      - name: Install pinned Claude CLI
        if: steps.auth.outputs.enabled == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          echo "cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125  $RUNNER_TEMP/install-claude.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/install-claude.sh" 2.1.227
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Execute selected repositories
        if: steps.auth.outputs.enabled == 'true'
        run: worthit daily --run-date "${{ needs.discover.outputs.run_date }}" --execute --allow-runc --base-path /worthit/ --site-url https://drj0e.github.io/worthit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MAX_LLM_COST_PER_REPO: "5"
          MAX_TOTAL_DAILY_LLM_COST: "25"
      - name: Stage bounded evaluator state
        id: stage-resume
        if: always()
        run: |
          set -euo pipefail
          root=.worthit/resume-cache
          rm -rf -- "$root"
          mkdir -p "$root/runs"
          list="$RUNNER_TEMP/worthit-resume-states"
          : > "$list"
          now=$(date -u +%s)
          cutoff=$((now - 14 * 24 * 60 * 60))
          while IFS= read -r -d '' state; do
            updated=$(jq -er '[.stages[]?.updated_at] | max // empty' "$state") || continue
            updated_epoch=$(date -u -d "$updated" +%s) || continue
            if (( updated_epoch >= cutoff && updated_epoch <= now + 300 )); then
              printf '%s\t%s\n' "$updated_epoch" "$state" >> "$list"
            fi
          done < <(find .worthit/runs -mindepth 3 -maxdepth 3 -type f -name state.json -print0 2>/dev/null)
          count=0
          while IFS=$'\t' read -r _ state; do
            run_dir=${state%/state.json}
            relative=${run_dir#".worthit/runs/"}
            [[ "$relative" =~ ^[^/]+/[0-9a-f]{40}$ ]] || continue
            sha=${relative##*/}
            jq -e --arg sha "$sha" '.commit_sha == $sha and (.repository_url | type) == "string" and (.inspection_revision | type) == "number" and (.stages | type) == "object"' "$state" >/dev/null || continue
            destination="$root/runs/$relative"
            mkdir -p "$destination"
            jq '{repository_url, commit_sha, inspection_revision, stages: (.stages | map_values({status, updated_at}))}' "$state" > "$destination/state.json"
            while IFS= read -r -d '' file; do
              model_file=${file#"$run_dir/"}
              [[ "$model_file" =~ ^[^/]*-model[^/]*/(response\.json|request\.sha256)$ ]] || continue
              test "$(stat -c %s "$file")" -le 5000000 || continue
              mkdir -p "$destination/${model_file%/*}"
              if [[ "$model_file" == */response.json ]]; then
                jq -e '(.structured_output | type) == "object" and (.total_cost_usd | type) == "number"' "$file" >/dev/null || continue
                jq '{structured_output, total_cost_usd}' "$file" > "$destination/$model_file"
              elif grep -Eq '^[0-9a-f]{64}$' "$file"; then
                install -m 600 "$file" "$destination/$model_file"
              fi
            done < <(find "$run_dir" -mindepth 2 -maxdepth 2 -type f \( -name response.json -o -name request.sha256 \) -print0)
            if test "$(du -sb "$root" | cut -f1)" -gt 52428800; then
              rm -rf -- "$destination"
              continue
            fi
            count=$((count + 1))
            test "$count" -lt 20 || break
          done < <(sort -rn "$list")
          test "$(find "$root" -type f | wc -l)" -le 750
      - name: Save bounded evaluator state
        if: always() && steps.stage-resume.outcome == 'success' && steps.resume-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .worthit/resume-cache
          key: ${{ steps.resume-cache.outputs.cache-primary-key }}
      - name: Build and sanitize release state
        run: |
          worthit build-site --base-path /worthit/ --site-url https://drj0e.github.io/worthit
          worthit verify-site --base-path /worthit/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-state
          path: |
            data/candidates.json
            hunts
            reviews
          if-no-files-found: error
          retention-days: 2

  record:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-state
          path: .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Rebuild only from sanitized artifacts
        run: |
          worthit build-site --base-path /worthit/ --site-url https://drj0e.github.io/worthit
          worthit verify-site --base-path /worthit/
      - name: Record changed reviews and hunt state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/candidates.json hunts reviews
          if ! git diff --cached --quiet; then
            git commit -m "content: publish daily WorthIt run"
            git push
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
